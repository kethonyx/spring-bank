spring.application.name=springbank

# Override via env vars (SPRING_DATASOURCE_URL, DB_USERNAME, ...) — never commit real credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springbank}
spring.datasource.username=${DB_USERNAME:springbank}
spring.datasource.password=${DB_PASSWORD:springbank}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Must be at least 32 bytes. Set JWT_SECRET in any real environment.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
jwt.expiration=${JWT_EXPIRATION:1h}
